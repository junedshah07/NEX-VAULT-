<style>
:root{--bg:#0b0c10;--card:#14161d;--line:#232734;--txt:#e8eaf0;--mut:#8b93a7;--blue:#3b82ff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:14px Inter,Arial,sans-serif}
h3{margin:0 0 12px;font-family:Montserrat,sans-serif}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lb{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:360px;text-align:center}
.lb img{height:50px;width:auto;margin-bottom:16px}
header{display:flex;align-items:center;gap:12px;padding:12px 4%;border-bottom:1px solid var(--line);flex-wrap:wrap}
header img{height:34px;width:auto}
header b{font-family:Montserrat,sans-serif;flex:1;min-width:110px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 4%;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
#tabs button{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:8px 14px;cursor:pointer}
#tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
main{max-width:980px;margin:auto;padding:18px 4% 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.st span{color:var(--mut);font-size:12px}.st b{display:block;font:800 24px Montserrat,sans-serif;margin-top:6px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
label{display:block;color:var(--mut);font-size:12px}
.in{width:100%;margin-top:5px;background:#0f1117;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:inherit}
textarea.in{resize:vertical}
.ck{display:flex;gap:18px;margin:10px 0}.ck input{margin-right:6px}
.b{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 14px Inter,sans-serif;cursor:pointer}
.b.g{background:#232734}.b.r{background:#e5484d}.b.s{padding:7px 12px;font-size:12px}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.th{width:44px;height:44px;border-radius:10px;background:#0f1117;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px;flex:none}.th img{width:100%;height:100%;object-fit:cover}
.tx{flex:1;min-width:0}.tx small{display:block;color:var(--mut);margin-top:2px}.tx b{word-break:break-word}
.pv{height:80px;border-radius:10px;margin:8px 0}
.bars{display:flex;gap:10px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}.bw{height:90px;width:100%;display:flex;align-items:flex-end}.bw i{display:block;width:100%;background:linear-gradient(#3b82ff,#1d4ed8);border-radius:6px 6px 0 0;min-height:2px}.bc em{font-style:normal;font-size:11px}.bc small{color:var(--mut);font-size:10px}
.note{color:var(--mut);font-size:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:#2bd4a0;color:#06251c;padding:10px 18px;border-radius:20px;font-weight:700;transition:.3s}#toast.on{transform:translate(-50%,0)}
.pts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.pt{position:relative;width:78px;height:78px}.pt img{width:100%;height:100%;object-fit:cover;border-radius:10px}.pt b{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:3px}.pt b button{background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:6px;font-size:11px;padding:2px 6px;cursor:pointer}.pt em{background:#3b82ff;color:#fff;border-radius:6px;padding:2px 5px;font-style:normal;font-size:10px}

#upbar{display:none;position:fixed;left:12px;right:12px;bottom:14px;z-index:99;background:#0b0c10;border:1px solid var(--blue);color:#fff;padding:12px 14px;border-radius:12px;font-size:13px;text-align:center}
#hno{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--blue);background:transparent;cursor:pointer;vertical-align:middle;margin-right:10px;flex:none}
#hno:checked{background:var(--blue);box-shadow:inset 0 0 0 5px var(--card)}
.vt{position:relative;width:110px;min-height:78px;border-radius:10px;background:#1b1f2b;border:1px solid var(--line);padding:8px;font-size:11px;color:var(--mut);word-break:break-all}
.vt b{display:block;font-size:22px}.vt button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:20px;height:20px;background:#e5484d;color:#fff;cursor:pointer}

.lkr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#0f1117;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.lkr .ic{width:44px;height:44px;border-radius:10px;background:#1b1f2b;display:flex;align-items:center;justify-content:center;flex:none}
.lkr .ic img{width:30px;height:30px;object-fit:contain}
.lkr .in{flex:1;min-width:120px}.lkr .up{font-size:12px;color:var(--blue);cursor:pointer;white-space:nowrap}

.od{background:#0f1117;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.od .oh{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.od .os{font-size:11px;font-weight:700;background:#2a2410;color:#f5b73b;padding:3px 9px;border-radius:12px;white-space:nowrap}.od .os.ok{background:#0f2a1c;color:#35d07f}.od .os.no{background:#2e1214;color:#ff6b72}.od .os.in{background:#1d2230;color:#9aa6bd}.od .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.od .ob{font-size:13.5px;line-height:1.75}.od a{color:var(--blue)}.od small{color:var(--mut)}
.od .b{margin-top:8px}
.codebox{width:100%;height:150px;background:#07080c;color:#9fe3b0;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 monospace}

function knock(u,cb){const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let k=0;k<p.length;k+=4){const m=Math.min(p[k],p[k+1],p[k+2]);if(p[k+3]&&m>200){const al=Math.max(0,Math.min(255,(255-m)*4.6));p[k+3]=Math.min(p[k+3],al)}}x.putImageData(d,0,0);let x0=c.width,y0=c.height,x1=0,y1=0;for(let yy=0;yy<c.height;yy++)for(let xx=0;xx<c.width;xx++)if(p[(yy*c.width+xx)*4+3]>12){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}if(x1<=x0||y1<=y0)return cb(c.toDataURL('image/png'));const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);cb(o.toDataURL('image/png'))};i.onerror=()=>cb(u);i.src=u}

function normIcon(file,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const S=512,k=Math.min(1,S/Math.max(i.width,i.height)),w=Math.round(i.width*k),h=Math.round(i.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(i,0,0,w,h);const d=x.getImageData(0,0,w,h),p=d.data,mn=q=>Math.min(p[q],p[q+1],p[q+2]);
 const seen=new Uint8Array(w*h),st=[],push=(xx,yy)=>{if(xx<0||yy<0||xx>=w||yy>=h)return;const id=yy*w+xx;if(seen[id])return;const q=id*4;if(p[q+3]>10&&mn(q)<225)return;seen[id]=1;st.push(id)};
 for(let a=0;a<w;a++){push(a,0);push(a,h-1)}for(let b=0;b<h;b++){push(0,b);push(w-1,b)}
 while(st.length){const id=st.pop(),xx=id%w,yy=(id-xx)/w;push(xx+1,yy);push(xx-1,yy);push(xx,yy+1);push(xx,yy-1)}
 const orig=new Uint8ClampedArray(p);
 for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const id=yy*w+xx,q=id*4;if(seen[id]){p[q+3]=0;continue}let near=false;for(let dy=-2;dy<=2&&!near;dy++)for(let dx=-2;dx<=2;dx++){const X=xx+dx,Y=yy+dy;if(X>=0&&Y>=0&&X<w&&Y<h&&seen[Y*w+X]){near=true;break}}
  if(near){const m=Math.min(orig[q],orig[q+1],orig[q+2]);if(m>25){const al=Math.max(.15,1-m/255);for(let z=0;z<3;z++)p[q+z]=Math.max(0,Math.min(255,(orig[q+z]-255*(1-al))/al));p[q+3]=Math.round(255*al)}}}
 x.putImageData(d,0,0);let x0=w,y0=h,x1=-1,y1=-1;for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++)if(p[(yy*w+xx)*4+3]>12){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}
 if(x1<0)return cb('');const bw=x1-x0+1,bh=y1-y0+1,sc=Math.min(184/bw,184/bh),o=document.createElement('canvas');o.width=o.height=192;const ox=o.getContext('2d');ox.imageSmoothingQuality='high';ox.drawImage(c,x0,y0,bw,bh,(192-bw*sc)/2,(192-bh*sc)/2,bw*sc,bh*sc);cb(o.toDataURL('image/png'))};i.onerror=()=>cb('');i.src=r.result};r.readAsDataURL(file)}

function upQR(el){const f=el.files[0];el.value='';if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingEnabled=false;x.drawImage(i,0,0,c.width,c.height);T.qr=c.toDataURL('image/png');pvQR()};i.onerror=()=>alert('Image read nahi hui.');i.src=r.result};r.readAsDataURL(f)}

function calc(){const m=+$('#pm').value,d=+$('#pd').value||0;$('#pf').value=m?Math.floor(m*(100-d)/100):''}
function autoCat(){const n=$('#pn').value.toLowerCase(),c=DB.cats.find(c=>n.includes(c.n.toLowerCase())||(c.k||'').split(',').some(k=>k.trim()&&n.includes(k.trim().toLowerCase())));if(c)$('#pc').value=c.n}
function saveProd(){
 const n=$('#pn').value.trim(),m=+$('#pm').value;if(!n||!m)return alert('Name aur MRP zaroori hai.');
 const old=ed>=0?DB.products[ed]:{};
 const p=Object.assign({},old,{id:old.id||old.name||'p'+Date.now(),name:n,cat:$('#pc').value,mrp:m,disc:Math.min(95,Math.max(0,+$('#pd').value||0)),emoji:$('#pe').value.trim(),imgs:(T.imgs||[]).slice(),vids:(T.vids||[]).slice(),qr:T.qr||'',link:$('#pl').value.trim(),desc:$('#pds').value.trim(),isNew:$('#pnw').checked,hidden:$('#phd').checked});
 delete p.price;delete p.img;
 const upd=ed>=0;upd?DB.products[ed]=p:DB.products.push(p);
 save(upd?'Updated ✓':'Product added ✓');ed=-1;T={};draw();
}
function delProd(i){if(confirm('Product delete karein?')){DB.products.splice(i,1);save('Deleted ✓');draw()}}
function addCat(){const n=$('#cn').value.trim();if(!n)return;if(DB.cats.some(c=>c.n.toLowerCase()==n.toLowerCase()))return alert('Category already hai.');DB.cats.push({n,k:$('#ck').value.trim()});save('Category added ✓');draw()}
function editCat(i){const c=DB.cats[i],n=prompt('Category name',c.n);if(!n)return;const k=prompt('Keywords (comma se)',c.k||'');DB.products.forEach(p=>{if(p.cat==c.n)p.cat=n.trim()});DB.heroes.forEach(x=>{if(x.cat==c.n)x.cat=n.trim()});c.n=n.trim();c.k=k||'';save();draw()}
function delCat(i){const c=DB.cats[i];if(DB.cats.length<2)return alert('Kam se kam 1 category rehni chahiye.');const to=DB.cats[i?0:1].n;if(!confirm('"'+c.n+'" delete? Iske products "'+to+'" mein move honge.'))return;DB.products.forEach(p=>{if(p.cat==c.n)p.cat=to});DB.heroes.forEach(x=>{if(x.cat==c.n)x.cat=''});DB.cats.splice(i,1);save('Deleted ✓');draw()}
function saveHero(){const t=$('#ht').value.trim(),v=(T.hvid||'').trim();if(!(t||T.himg||T.mimg||v))return alert('Title, photo ya video mein se kuch to daalein.');const x={badge:$('#hb').value.trim(),title:t,text:$('#hx').value.trim(),btn:$('#hbn').value.trim(),cat:$('#hc').value,emo:$('#he').value.trim(),img:T.himg||'',mimg:T.mimg||'',vid:v,notext:$('#hno').checked};const upd=ed>=0;upd?DB.heroes[ed]=x:DB.heroes.push(x);save(upd?'Updated ✓':'Slide added ✓');ed=-1;T={};draw()}
function delHero(i){if(confirm('Slide delete karein?')){DB.heroes.splice(i,1);save('Deleted ✓');draw()}}
function mv(i,d){const j=i+d;if(j<0||j>=DB.heroes.length)return;[DB.heroes[i],DB.heroes[j]]=[DB.heroes[j],DB.heroes[i]];save();draw()}
function savePage(){const t=$('#gt').value.trim();if(!t)return alert('Title zaroori hai.');const old=ed>=0?DB.pages[ed]:{};let s=old.slug;if(!s){const b=sl(t);let n=2;s=b;while(DB.pages.some(p=>p.slug==s))s=b+'-'+n++}const x={title:t,slug:s,where:$('#gw').value,body:$('#gb').value};const upd=ed>=0;upd?DB.pages[ed]=x:DB.pages.push(x);save(upd?'Updated ✓':'Page added ✓');ed=-1;draw()}
function delPage(i){if(confirm('Page delete karein?')){DB.pages.splice(i,1);save('Deleted ✓');draw()}}
function delOrd(i){const o=getOrd();o.splice(i,1);localStorage.setItem('orders',JSON.stringify(o));draw()}
function clrOrd(){if(confirm('Saare orders delete karein?')){localStorage.removeItem('orders');draw()}}
function saveSet(){const g=i=>$('#'+i).value.trim();Object.assign(DB.settings,{name:g('sn')||'NEX VAULT',foot:g('sf'),announce:g('sa1'),email:g('se'),phone:g('sp'),wa:g('sw'),ig:g('si'),tg:g('st'),site:g('ss'),siteName:g('ssn'),yt:g('syt'),hook:g('shk'),upi:g('supi'),upiName:g('supn'),siteLogo:T.slogo||'',links:(T.links||[]).filter(l=>String(l.u||'').trim()).map(l=>({n:String(l.n||'').trim(),u:l.u.trim(),l:l.l||''})),cld:g('scl'),cldp:g('scp'),auto:Math.max(2,+g('sd')||4.5),accent:$('#sc').value,logo:T.logo||'',logoT:!!T.logo});save('Settings saved ✓');draw()}
function chPw(){const v=$('#np').value;if(v.length<4)return alert('Kam se kam 4 characters.');localStorage.setItem('nv_pass',v);$('#np').value='';toast('Password changed ✓')}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='data.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{DB=norm(JSON.parse(r.result));save('Imported ✓');draw()}catch(e){alert('Invalid file')}};r.readAsText(f)}
function rst(){if(confirm('Saara data (products, heroes, pages, settings, stats, orders) reset karein?')){['nv_db','nv_stats','products','orders'].forEach(k=>localStorage.removeItem(k));DB=norm(null);draw();toast('Reset ✓')}}
</script></body></html>
