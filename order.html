<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Your order — NEX VAULT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#eef2fb;color:#0f172a;min-height:100vh}
header{background:#fff;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 14px rgba(15,23,42,.06)}
header img{height:38px;width:auto}header a{color:#155eef;font-weight:700;text-decoration:none;font-size:14px}
main{max-width:560px;margin:26px auto 60px;padding:0 16px}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 34px rgba(15,23,42,.08);margin-bottom:16px}
h1{font-family:Montserrat,Inter,sans-serif;font-size:26px;font-weight:800;margin-bottom:4px}
.sub{color:#64748b;font-size:14px;margin-bottom:16px;word-break:break-all}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;padding:8px 14px;border-radius:30px}
.b-wait{background:#fff6e0;color:#a15c00}.b-ok{background:#e3f8ec;color:#0d7a43}.b-no{background:#fde8e8;color:#b42318}.b-flag{background:#fff0e6;color:#b54708}
.steps{display:flex;margin:20px 0 6px}.st{flex:1;text-align:center;font-size:11.5px;color:#94a3b8;font-weight:600;position:relative}
.st i{display:block;width:26px;height:26px;border-radius:50%;background:#e2e8f0;margin:0 auto 6px;line-height:26px;font-style:normal;font-size:13px;color:#fff;position:relative;z-index:1}
.st:not(:last-child):after{content:"";position:absolute;top:12px;left:50%;width:100%;height:3px;background:#e2e8f0}
.st.on{color:#155eef}.st.on i{background:#155eef}.st.on:not(:last-child):after{background:#155eef}.st.done{color:#0d7a43}.st.done i{background:#16a34a}.st.done:not(:last-child):after{background:#16a34a}
.it{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #eef1f6}.it:first-of-type{border-top:0}
.it .n{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.35}.it small{display:block;color:#64748b;font-weight:500;font-size:12.5px;margin-top:3px}
.dl{flex:none;text-decoration:none;border:0;cursor:pointer;color:#fff;font-weight:800;font-size:13.5px;padding:11px 16px;border-radius:12px;background:linear-gradient(90deg,#4c1d95,#7c3aed,#2563eb);font-family:inherit}
.dl.off{background:#e2e8f0;color:#94a3b8;pointer-events:none}
.tot{display:flex;justify-content:space-between;border-top:2px solid #0f172a;padding-top:14px;margin-top:6px;font-weight:800;font-size:17px}
.note{font-size:13.5px;line-height:1.55;color:#475569;margin-top:14px}
input{width:100%;padding:14px 16px;border:1.5px solid #cbd5e1;border-radius:14px;font:inherit;font-size:15px;margin-bottom:12px;background:#f8fafc}input:focus{outline:0;border-color:#3b82f6;background:#fff}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#001c64,#003087,#0070ba)}
.err{color:#b42318;font-size:13.5px;margin:-4px 0 12px;display:none}
</style></head><body>

<main id="m"><div class="card"><h1>Your order</h1><p class="sub">Loading…</p></div></main>
<script>
const $=s=>document.querySelector(s),h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=new URLSearchParams(location.search),ID=(P.get('id')||'').toUpperCase(),K=P.get('k')||'';let PHONE='',poll=null;
const OK='Verified ✔';
function state(st){if(st===OK)return 3;if(/rejected|refunded/i.test(st))return -1;if(/paid|mismatch|duplicate/i.test(st))return 2;return 1}
function steps(st){const n=state(st),L=['Order placed','Payment sent','Verified','Delivered'];return '<div class="steps">'+L.map((t,i)=>{const done=n>0&&i<Math.min(n,3),on=n>0&&i===n-0&&i<4;return `<div class="st ${n>0&&i<n?'done':(n>0&&i===n?'on':'')}"><i>${n>0&&i<n?'✓':i+1}</i>${t}</div>`}).join('')+'</div>'}
function render(o){
 const n=state(o.status),cls=n===3?'b-ok':n<0?'b-no':/mismatch|duplicate/i.test(o.status)?'b-flag':'b-wait';
 const label=n===3?'Payment verified':n<0?(/refund/i.test(o.status)?'Refunded':'Payment rejected'):/mismatch|duplicate/i.test(o.status)?'Needs a quick check':n===2?'Verifying your payment':'Waiting for payment';
 const items=o.items.map(i=>{let btn='';const d=i.delivery;
  if(n===3){if(!d||d.type==='pending')btn='<span class="dl off">Preparing…</span>';else if(d.type==='link')btn=`<a class="dl" href="${h(d.href)}" target="_blank" rel="noopener noreferrer">Open</a>`;else btn=`<a class="dl" href="${h(d.href)}">Download</a>`}
  return `<div class="it"><div class="n">${h(i.name)}<small>₹${h(i.price)}${d&&d.type==='file'?' · '+h(d.filename||'file')+' · link valid '+h(d.expires_in_min)+' min':''}</small></div>${btn}</div>`}).join('');
 $('#m').innerHTML=`<div class="card"><h1>Hi ${h((o.name||'').split(' ')[0]||'there')} 👋</h1><p class="sub">Order ${h(o.id)} · ${h(new Date(o.created_at).toLocaleString())}</p><span class="badge ${cls}">${n===3?'✅':n<0?'⛔':'⏳'} ${label}</span>${n>0?steps(o.status):''}
 <div style="margin-top:16px">${items}</div><div class="tot"><span>Total</span><span>₹${h(o.total)}</span></div>
 <p class="note">${n===3?'Your bundle is ready. Download links are private — please do not share them.':n<0?'This order was not approved. If you have already paid, contact support with your order ID and UTR number.':'We confirm each UPI payment against the bank credit before unlocking the download. This page updates automatically — you can keep it open.'}</p></div>`;
 clearInterval(poll);if(n>0&&n<3)poll=setInterval(load,12000);
}
async function load(){
 try{let r;if(K)r=await fetch('/api/orders/'+encodeURIComponent(ID)+'/status?k='+encodeURIComponent(K));else if(PHONE)r=await fetch('/api/orders/lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:ID,phone:PHONE})});else return ask();
  const j=await r.json();if(!r.ok){if(r.status===404){return ask('We could not find this order. Check the order ID and the phone number used at checkout.')}if(r.status===429)return ask('Too many attempts. Please wait a few minutes.');throw 0}render(j.order)}
 catch(e){if(!$('#m .badge'))$('#m').innerHTML='<div class="card"><h1>Something went wrong</h1><p class="sub">Please check your internet connection and refresh.</p></div>'}
}
function ask(msg){$('#m').innerHTML=`<div class="card"><h1>Find your order</h1><p class="sub">Enter your order ID and the phone number you used at checkout.</p>
 <input id="oid" placeholder="Order ID (e.g. NV1A2B3C)" value="${h(ID)}" autocapitalize="characters"><input id="ph" type="tel" inputmode="numeric" placeholder="10-digit phone number"><div class="err" id="er" ${msg?'style="display:block"':''}>${h(msg||'')}</div><button class="btn" onclick="go()">View order</button></div>`}
function go(){const id=$('#oid').value.trim().toUpperCase(),ph=$('#ph').value.replace(/\D/g,'').slice(-10);if(!/^NV[A-Z0-9]{6,30}$/.test(id)||ph.length!==10){$('#er').textContent='Enter a valid order ID and 10-digit phone number.';$('#er').style.display='block';return}location.search='?id='+encodeURIComponent(id);sessionStorage.setItem('nv_ph',ph)}
(function(){const ph=sessionStorage.getItem('nv_ph');if(ph&&!K){PHONE=ph;sessionStorage.removeItem('nv_ph')}if(!ID)return ask();load()})();
</script></body></html>
