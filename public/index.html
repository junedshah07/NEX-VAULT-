<title>NEX VAULT — Digital Products</title>
<style>
:root{--ink:#0e0f11;--blue:#155eef;--blue-deep:#0e3fbf;--bg:#eef2fa;--glass:rgba(255,255,255,.55);--glassbrd:rgba(255,255,255,.85);--line:rgba(14,15,17,.09);--muted:#5b6472;--paper:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;font-family:'Inter',Arial,sans-serif;background:linear-gradient(180deg,#e7edfb,var(--bg) 300px,var(--bg));color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Montserrat',sans-serif;font-weight:800}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top{height:76px;display:flex;align-items:center;gap:18px;padding:0 5%;max-width:1250px;margin:auto;transition:height .3s ease}
header.shrink .top{height:58px}
.logo img{height:46px;display:block;transition:height .3s ease}
header.shrink .logo img{height:38px}
.search{flex:1;max-width:480px;background:var(--paper);border:1px solid var(--line);border-radius:24px;display:flex;padding:3px}
.search input{border:0;outline:0;flex:1;padding:12px 15px;font-size:14px;background:transparent;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search button{border:0;background:var(--blue);color:#fff;border-radius:20px;padding:0 20px;font-weight:600;cursor:pointer}
.carticon{background:none;border:0;cursor:pointer;position:relative;display:flex;align-items:center;margin-left:auto}
.carticon svg{width:26px;height:26px;color:var(--ink)}
.carticon span{position:absolute;top:-6px;right:-8px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}
nav{overflow:auto;white-space:nowrap;border-bottom:1px solid var(--line)}
nav div{max-width:1250px;margin:auto;padding:12px 5%}
nav a{color:var(--muted);text-decoration:none;margin-right:26px;font-size:14px;font-weight:500;transition:color .2s}
nav a:hover{color:var(--blue)}
.container{max-width:1250px;margin:auto;padding:22px 5%}
.hero{--hh:min(84vh,780px);position:relative;overflow:hidden;height:var(--hh);min-height:440px;background:linear-gradient(135deg,#dfe8fb,#f4f7ff)}
@supports(height:1svh){.hero{--hh:min(84svh,780px)}}
.slide{position:absolute;inset:0;display:flex;align-items:center;padding:0 6%;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s}
.slide.on{opacity:1;visibility:visible}
.bgi,.vb,.vb video,.vb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bgi,.vb video{object-fit:cover}
.bgi.mo{display:none}
.vb{overflow:hidden;pointer-events:none}
.vb iframe{inset:auto;top:50%;left:50%;width:max(100vw,calc(var(--hh)*1.778));height:max(56.25vw,var(--hh));transform:translate(-50%,-50%)}
.slide.m.t::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,12,30,.72),rgba(6,12,30,.1) 75%)}
.slide.m:not(.t){justify-content:center;align-items:flex-end;padding-bottom:64px}
.hero-copy{max-width:560px;position:relative;z-index:2}
.badge{display:inline-block;background:var(--glass);border:1px solid var(--glassbrd);color:var(--blue-deep);padding:7px 14px;border-radius:20px;font-weight:600;font-size:13px;backdrop-filter:blur(8px)}
.hero h1{font-size:46px;line-height:1.08;margin:16px 0 14px}
.m .badge{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
.m h1{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.m p{color:rgba(255,255,255,.9)}
.hero p{font-size:17px;color:var(--muted);line-height:1.6;margin:0 0 26px}
.dots{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:4}
.dots span{width:9px;height:9px;border-radius:9px;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(14,15,17,.2);cursor:pointer;transition:width .3s}
.dots span.on{width:24px;background:var(--blue)}
.glassbtn{font-family:'Montserrat',sans-serif;font-weight:800;background:var(--glass);border:1px solid var(--glassbrd);color:var(--blue-deep);padding:14px 26px;border-radius:14px;cursor:pointer;font-size:15px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px -10px rgba(21,94,239,.35);transition:transform .25s ease}
.glassbtn:hover{transform:translateY(-2px)}
.stage{position:absolute;right:6%;top:50%;margin-top:-140px;width:300px;height:280px;z-index:2}
.tile{position:absolute;width:118px;height:118px;border-radius:22px;background:var(--glass);border:1px solid var(--glassbrd);display:flex;align-items:center;justify-content:center;font-size:40px;backdrop-filter:blur(14px);box-shadow:0 20px 36px -16px rgba(21,94,239,.25);animation:float 6s ease-in-out infinite}
.tile:nth-child(1){top:0;left:30px}.tile:nth-child(2){top:56px;left:170px}.tile:nth-child(3){top:150px;left:10px;animation-delay:.6s}.tile:nth-child(4){top:166px;left:176px;animation-delay:1.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media(prefers-reduced-motion:reduce){.tile{animation:none}.slide{transition:none}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:var(--glass);border:1px solid var(--glassbrd);border-radius:18px;overflow:hidden;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 6px 20px -10px rgba(14,15,17,.12);transition:transform .3s ease,box-shadow .3s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 34px -14px rgba(21,94,239,.28)}
.pic{height:160px;background:linear-gradient(135deg,rgba(21,94,239,.12),rgba(21,94,239,.03));display:flex;align-items:center;justify-content:center;font-size:44px}
.card .body{padding:16px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;line-height:1.4}
.price{font-size:20px;font-weight:800;color:var(--blue);font-family:'Montserrat',sans-serif}
.old{text-decoration:line-through;color:#e5262e;font-size:13px;margin-left:6px}
.buynow{width:100%;margin-top:14px;background:rgba(255,255,255,.45);border:1px solid var(--blue);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-family:'Montserrat',sans-serif;font-weight:800;font-style:italic;color:var(--blue);font-size:15px;padding:8px 0}
.buynow img{height:26px}
.buynow:hover{color:var(--blue-deep)}
.btn{font-family:'Montserrat',sans-serif;font-weight:800;background:var(--blue);border:0;color:#fff;padding:13px 22px;border-radius:11px;cursor:pointer;font-size:14px}
footer{margin-top:50px;background:var(--ink);color:#9aa0ac;padding:40px 5% 30px}
footer b{font-family:'Montserrat',sans-serif;font-size:20px;color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(14,15,17,.45);backdrop-filter:blur(4px);z-index:50;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.box{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;padding:24px;max-height:90vh;overflow:auto}
.close{position:absolute;top:14px;right:14px;z-index:5;font-size:20px;line-height:1;border:0;background:#f1f3f7;border-radius:50%;width:34px;height:34px;cursor:pointer}
.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:7px 0 12px;background:#fafbfd}
.row{display:flex;gap:10px}.row>*{flex:1}
.pay{background:linear-gradient(135deg,#eef2fa,#fff);border:1px solid var(--blue);border-radius:14px;padding:18px;margin:15px 0}
.pay strong{font-size:25px;color:var(--blue)}
.pay button{font-family:'Montserrat',sans-serif;margin-top:12px;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:800;cursor:pointer}
.notice{background:#fff8e6;border:1px solid #f1d36a;padding:13px;border-radius:10px;font-size:14px;color:var(--ink)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.search{display:none}.hero{--hh:min(80vh,700px)}@supports(height:1svh){.hero{--hh:min(80svh,700px)}}.slide{align-items:flex-end;padding:0 6% 64px}.slide:not(.m){align-items:center;padding-bottom:40px}.hero h1{font-size:30px}.stage{display:none}.bgi.mo{display:block}.bgi.d{display:none}.slide.m.t::after{background:linear-gradient(0deg,rgba(6,12,30,.94),rgba(6,12,30,.7) 42%,rgba(6,12,30,.08) 78%)}.hero-copy{max-width:100%}}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:10px}.container{padding:15px 4%}.pic{height:130px;font-size:32px}.logo img{height:36px}header.shrink .logo img{height:32px}.top{padding:0 4%}}
.ann{display:none;background:var(--blue);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:8px 12px}
.card{cursor:pointer}
.pic{position:relative;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:10px;left:10px;font-style:normal;font-size:11px;font-weight:800;font-family:'Montserrat',sans-serif;background:var(--blue);color:#fff;padding:4px 9px;border-radius:20px}
.tag.off{left:auto;right:10px;background:#fff;color:#12a150;border:1px solid #12a150}
.buynow:hover{background:rgba(21,94,239,.08)}
.himg{width:100%;height:100%;object-fit:cover;border-radius:22px;box-shadow:0 20px 36px -16px rgba(21,94,239,.3)}
.pdpic{width:100%;height:220px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,rgba(21,94,239,.12),rgba(21,94,239,.03));display:flex;align-items:center;justify-content:center;font-size:64px;margin-bottom:14px}
.pdpic img{width:100%;height:100%;object-fit:cover}
.chip{display:inline-block;background:rgba(21,94,239,.1);color:var(--blue);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
.pgb{white-space:pre-wrap;color:var(--muted);line-height:1.6;font-size:14px}
.contact{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0}.contact a{color:#cfd6e4;text-decoration:none;font-size:13px}
[hidden]{display:none!important}
.logo img{mix-blend-mode:normal;width:auto}
.offp{color:#12a150;font-weight:800;font-size:13px;margin-left:8px}
.pic video{width:100%;height:100%;object-fit:cover;display:block}
.pdpic video,.pdpic iframe{width:100%;height:100%;border:0;background:#000}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:-4px 0 14px;padding-bottom:4px}
.tb{flex:none;width:56px;height:56px;border-radius:10px;border:2px solid transparent;padding:0;overflow:hidden;cursor:pointer;background:#e8eefc;position:relative}
.tb.on{border-color:var(--blue)}
.tb img{width:100%;height:100%;object-fit:cover;display:block}
.tb i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;font-style:normal}
#pdBody h2{margin:6px 0 12px;font-size:24px;line-height:1.2;overflow-wrap:anywhere}#pdBody .chip{margin-bottom:12px}#pdBody .pgb{margin:12px 0}.m p{text-shadow:0 1px 10px rgba(0,0,0,.6)}.m .badge{backdrop-filter:blur(10px)}.ico{width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:8px}.contact a{display:inline-flex;align-items:center}
#pageView{max-width:780px;margin:0 auto;padding:10px 0 20px}
#pageView h1{font-size:32px;margin:0 0 14px}
.back{display:inline-block;color:var(--blue);font-weight:700;text-decoration:none;margin-bottom:14px}
.pgc h3{font-size:18px;margin:22px 0 8px}.pgc p,.pgc li{color:var(--muted);line-height:1.7;font-size:15px}.pgc ul{padding-left:20px}

						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

 d.innerHTML=`<div class="okc"><div class="ring"></div><div class="pulse"></div><svg viewBox="0 0 104 104"><path d="M31 54l15 15 29-31"/></svg></div><div class="okh">Hurray!! You've successfully<br>made the payment.</div><div class="okp">You will receive further updates on your registered mobile number and Email ID.</div><div class="okp">Your bundle pack will also be delivered to your registered Email ID.</div><div class="okn">Order ID: ${h(o.id)} · Your bundle will be sent as soon as your payment is verified.</div><button class="okb" onclick="finishOrder()">Done</button>`;
 const c=d.querySelector('.okc'),cols=['#ff4d6d','#ffb703','#3a86ff','#2ec4b6','#8338ec','#fb5607','#06d6a0'];
 for(let k=0;k<34;k++){const p=document.createElement('i'),ang=Math.random()*Math.PI*2,dist=70+Math.random()*120,w=5+Math.random()*7;p.className='pp';p.style.cssText=`width:${w}px;height:${Math.random()>.5?w:w*2.2}px;background:${cols[k%cols.length]};border-radius:${Math.random()>.6?'50%':'2px'};--x:${Math.cos(ang)*dist}px;--y:${Math.sin(ang)*dist-30}px;--r:${Math.random()*720-360}deg;--d:${1.1+Math.random()*.7}s;--dl:${.45+Math.random()*.2}s;margin:-3px 0 0 -3px`;c.appendChild(p)}
 d.parentNode.scrollTop=0}

function closeModal(id){$('#'+id).classList.remove("show");if(id=='checkout'){CKS.busy=0}if(id=='pd')$('#pdBody').innerHTML=''}
$('#pd').addEventListener('click',e=>{if(e.target.id=='pd')closeModal('pd')});

const CPLUS='<svg class="ic1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20.2" r="1.4"/><circle cx="18" cy="20.2" r="1.4"/><path d="M1.5 2.5h3l2.4 11.6a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.5L21 7H5.4"/><path d="M10.9 11.3h4.8M13.3 8.9v4.8" stroke-width="1.9"/></svg><svg class="ic2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function pid(p){return p.id||p.name}
function inCart(p){return cart.indexOf(p)>-1}
function addBtn(i){const p=DB.products[i];return `<button class="addc${inCart(p)?' on':''}" data-i="${i}" onclick="event.stopPropagation();addCart(${i})" aria-label="Add to cart">${CPLUS}</button>`}
function cartSave(){try{localStorage.setItem('nv_cart',JSON.stringify(cart.map(pid)))}catch(e){}}
function cartLoad(){try{const ids=JSON.parse(localStorage.getItem('nv_cart')||'[]');cart=ids.map(x=>DB.products.find(p=>pid(p)===x)).filter(Boolean)}catch(e){cart=[]}}
function updCart(){const c=$('#cartCount');if(c)c.textContent=cart.length;document.querySelectorAll('.addc').forEach(b=>{const p=DB.products[+b.dataset.i];b.classList.toggle('on',!!p&&inCart(p))})}
function addCart(i){const p=DB.products[i];if(!p)return;if(inCart(p)){openCart();return}cart.push(p);cartSave();updCart();track('carts',pid(p));ckToast('Added to cart ✓')}
function rmCart(k){cart.splice(k,1);cartSave();updCart();openCart()}
function openCart(){const T=Math.round(cart.reduce((a,p)=>a+Number(fp(p)),0)*100)/100;
 $('#ctn').textContent=cart.length?'('+cart.length+')':'';
 $('#cartItems').innerHTML=cart.length?cart.map((p,k)=>`<div class="cti"><div class="ctp">${cover(p)}</div><div class="ctt"><b>${h(p.name)}</b><span>₹${fp(p)}${p.mrp>fp(p)?`<s>₹${p.mrp}</s>`:''}</span></div><button class="ctx" onclick="rmCart(${k})" aria-label="Remove">✕</button></div>`).join(''):'<div class="cte"><div>🛒</div><p>Your cart is empty.</p><button class="okb" onclick="closeModal(\'cart\')">Browse products</button></div>';
 $('#ctfoot').innerHTML=cart.length?`<div class="cts"><span>Total (${cart.length} item${cart.length>1?'s':''})</span><b>₹${T}</b></div><button class="pn2" onclick="checkoutCart()"><img class="nlg" src="${$('#payNowBtn .nlg').src}" alt=""><span>Checkout</span></button>`:'';
 hydrate($('#cartItems'));$('#cart').classList.add('show')}
function checkoutCart(){if(!cart.length)return;closeModal('cart');openCheckout(cart.slice(),true)}
function ckTotal(){return Math.round(CKS.items.reduce((a,p)=>a+Number(fp(p)),0)*100)/100}
function ckName(){return CKS.items.map(p=>p.name).join(' + ').slice(0,160)}
function boot(){cartLoad();apply();nav();hero();render();foot();route();updCart()}
$('#search').addEventListener('input',()=>{toHome();render()});
window.addEventListener('hashchange',route);
window.addEventListener('scroll',()=>$('#siteHeader').classList.toggle('shrink',window.scrollY>10));
let tx=0,ty=0;const hs=$('#heroSlider');
hs.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
hs.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty,n=DB.heroes.length;if(n>1&&Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.5)goSlide((slideIdx+(dx<0?1:n-1))%n,1)},{passive:true});
visit();boot();
let hasDB=false;try{hasDB=!!localStorage.getItem('nv_db')}catch(e){}
if(!hasDB)fetch('data.json?'+Date.now()).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.products){DB=norm(d);boot()}}).catch(()=>{});
</script>
</body>
